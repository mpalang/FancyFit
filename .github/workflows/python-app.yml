name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        pip install -r requirements.txt

    # Optional (step 2): install the private fittoolkit so fit tests can run.
    # Needs the repository secret FITTOOLKIT_TOKEN (read-only token for the fittoolkit repo).
    # - name: Install fittoolkit (private)
    #   shell: bash
    #   env:
    #     TOKEN: ${{ secrets.FITTOOLKIT_TOKEN }}
    #   run: pip install "git+https://mpalang:${TOKEN}@github.com/mpalang/fittoolkit.git"

    - name: Lint with ruff
      run: ruff check .

    - name: Test with pytest
      run: pytest
